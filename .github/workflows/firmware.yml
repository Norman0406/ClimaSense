# Firmware checks: unit tests on the PC, and the ESP-IDF build.
name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Unit tests (PC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: cmake -S firmware/test/host -B build/host -G Ninja

      - name: Build
        run: cmake --build build/host

      - name: Run
        run: ctest --test-dir build/host --output-on-failure

  build:
    name: Build (ESP-IDF 6.1.1)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build
        working-directory: firmware
        shell: bash
        run: |
          # The container runs as root on a checkout owned by the runner; without this,
          # `git describe` (the app version) fails.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build

      # The .elf decodes crash backtraces and core dumps of exactly this build (the device logs
      # the first 16 hex characters of its SHA-256 as "build"). The images and flash_args allow
      # flashing this build without rebuilding it.
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            firmware/build/climasense.elf
            firmware/build/climasense.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flash_args
